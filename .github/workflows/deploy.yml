name: Deploy parivant.se

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: parivant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and start Vulture
        run: ./start.sh
      - name: Check dashboard and API
        run: |
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8000/ | cmp dashboard/index.html -
          # the API is locked: no token -> 401, right token -> 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/scans)" = 401
          TOKEN=$(grep '^APP_TOKEN=' .env | cut -d= -f2)
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8000/api/scans | jq -e '. == []'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy the tested commit to Vultr
        env:
          DEPLOY_KEY: ${{ secrets.VULTURE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VULTURE_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "${DEPLOY_KEY:?Missing VULTURE_DEPLOY_KEY}" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "${KNOWN_HOSTS:?Missing VULTURE_KNOWN_HOSTS}" > "$RUNNER_TEMP/known_hosts"
          ssh -T -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -i "$RUNNER_TEMP/deploy_key" root@parivant.se "$GITHUB_SHA"
